name: Notion ingeniería · exportación candidata

# Manual: the existing research radars own their cadence. This workflow adds
# no duplicate cron and never commits, merges or deploys a candidate snapshot.
on:
  workflow_dispatch:
    inputs:
      read_notion:
        description: Leer la selección autorizada en Notion (requiere NOTION_TOKEN)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar contrato público
        run: node tests/test_notion_ingenieria.mjs
      - name: Preparar exportación local
        if: ${{ !inputs.read_notion }}
        run: node tools/export-notion-ingenieria.mjs --input data/notion-ingenieria.json --output /tmp/notion-ingenieria.json
      - name: Preparar exportación desde Notion
        if: ${{ inputs.read_notion }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node tools/export-notion-ingenieria.mjs --notion --input data/notion-ingenieria.json --output /tmp/notion-ingenieria.json
      - uses: actions/upload-artifact@v4
        with:
          name: notion-ingenieria-candidate
          path: /tmp/notion-ingenieria.json
          if-no-files-found: error
