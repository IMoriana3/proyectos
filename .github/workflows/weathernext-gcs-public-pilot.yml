# One-time anonymous WeatherNext 3 GCS access verification.
# Public repo STANDARD runner: free per GitHub documentation.
# No Google ADC, billing account, secrets, Supabase access, artifact, or cron.
name: WeatherNext GCS - anonymous pilot

on:
  pull_request:
    paths:
      - .github/workflows/weathernext-gcs-public-pilot.yml

permissions:
  contents: read

jobs:
  public-gcs-read:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only Zarr libraries
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check \
            'xarray>=2025.1,<2027' 'dask[array]>=2025.1,<2027' \
            'zarr>=3,<4' 'obstore>=0.6,<1'
      - name: One point, one hour, no Google credential
        run: |
          set -euo pipefail
          python tools/weathernext_gcs_probe.py \
            --lat 41.575945 --lon -0.798424 --hours 1 > "$RUNNER_TEMP/wn3.json"
          python - "$RUNNER_TEMP/wn3.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          assert j["status"]=="GCS_NUMERIC_POINT_READ_OK"
          assert j["published_to_supabase"] is False
          assert j["is_live_in_solargpt"] is False
          assert len(j["samples"])==1
          counts=j["valid_numeric_counts"]
          assert counts.get("temperature_2m_p50")==1
          assert counts.get("wind_speed_10m_p50")==1
          print("PASS: anonymous public GCS point read; no paid Google project")
          print("Grid:",j["grid"],"numeric variables:",counts)
          PY
