# Portal protegido: Cloudflare Pages sustituye a GitHub Pages.
#
# Comprobamos (1) que el empaquetado no filtra ficheros internos y
# (2) que peticiones SIN credenciales a producción reciben el login Access.
#
# IMPORTANTE: esto NO ejecuta las simulaciones en el servidor real: Access
# impide que el antiguo arnés Playwright entre sin un token de servicio.
# La comprobación funcional autenticada queda expresamente PENDIENTE.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:

concurrency:
  group: pages-publicado
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicado:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Preparar exactamente el paquete de Cloudflare Pages
        env:
          # SOLO para generar una copia de prueba en este runner. No escribe
          # variables ni publica nada en Cloudflare.
          FACTIUN_PAGES_ACCESS_CONFIRMED: '1'
        run: bash tools/build-cloudflare-pages.sh

      - name: Paquete sin herramientas ni datos ajenos al portal
        run: |
          set -euo pipefail
          for file in index.html sim-viento.html comparador-estructuras.html \
                      generador-layout.html cartera-tabla.html meteo.html \
                      docs/viento.md data/cec-modulos.json lib/three.min.js \
                      sw.js manifest.webmanifest _headers; do
            test -s "dist/$file" || { echo "FALTA: dist/$file"; exit 1; }
          done
          for dir in .github tests tools prompts docs/audit; do
            test ! -e "dist/$dir" || { echo "NO PUBLICAR: dist/$dir"; exit 1; }
          done
          if grep -Fq 'https://imoriana3.github.io/proyectos/' dist/index.html; then
            echo "La portada conserva enlaces a su antiguo dominio"
            exit 1
          fi
          grep -Fq '"id": "/"' dist/manifest.webmanifest
          grep -Fq 'X-Robots-Tag: noindex' dist/_headers

      - name: Autocomprobación de las reglas de Access
        run: node tools/test_cloudflare_access.mjs --self-test

      - name: Producción bloqueada sin identificación (rutas y datos)
        env:
          PAGES_BASE: https://panel-im3.pages.dev
        run: node tools/test_cloudflare_access.mjs

      # PENDIENTE explícito: el cronómetro antes se conducía por Playwright
      # sin login; ahora requiere credenciales Cloudflare Access para CI.
      # No se simula ni se declara un "verde" de la prueba funcional.
