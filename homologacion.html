/* Sistema visual del Panel de Proyectos Factiun (proyectos/index.html): mismo
   void, mismos paneles, mismos colores de estado. Oscura a propósito, como el
   resto de fichas; en papel se imprime en claro. */
:root{
  color-scheme: dark;
  --void:#0E1826; --panel:#132238; --panel-2:#101D30; --panel-hi:#1A2D48;
  --line:#27405F; --line-soft:#1E3250;
  --ink:#DCE3EB; --ink-2:#8C9AAB; --ink-3:#7F8EA1;
  --accent:#F09030; --accent-ink:#1A0F04;
  --chip-bg:#1A2D48; --focus:#F09030;
  --radius:2px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  /* LOS CUATRO NIVELES DE EVIDENCIA. Verde, amarillo y coral son los de estado
     del Panel. El azul NO es el `--demo` del Panel (#68C0D8): contra el verde
     daba ΔE 11,4 con visión normal, por debajo del suelo de 15, y «medido» y
     «simulado» son justo los dos que no se pueden confundir. Con #4F8FE0 el
     peor par queda en 19,2 (normal) y 9,4 (deuteranopía), medido con el
     validador de paleta sobre el panel #132238. Y nunca van solos: cada nivel
     lleva su signo y su nombre. */
  --ev-medido:#5BBF8A; --ev-simulado:#4F8FE0; --ev-declarado:#F2C94C; --ev-falta:#E84858;
}
*{box-sizing:border-box;}
body{
  background-color:var(--void); color:var(--ink);
  background-image:
    radial-gradient(120% 80% at 50% -10%, color-mix(in srgb,var(--accent) 6%,transparent), transparent 60%),
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size:auto, 34px 34px, 34px 34px;
  background-attachment:fixed;
  font-family:var(--sans); font-size:15px; line-height:1.5; margin:0;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding:22px 20px 64px;}
a{color:var(--accent);}
:is(button,input,a,[tabindex]):focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums;}
.eyebrow{font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);}

/* ---------- barra y cabecera ---------- */
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
.bar .sp{flex:1 1 auto;}
.back{color:var(--ink-2); text-decoration:none; font-size:13.5px;}
.back:hover{color:var(--ink);}
button{font:inherit; font-size:13px; font-weight:600; border-radius:2px; cursor:pointer;
  padding:6px 13px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink);}
button:hover{background:var(--panel-hi);}
.seg{display:inline-flex;}
.seg button{border-radius:0; margin-left:-1px;}
.seg button:first-child{margin-left:0; border-radius:2px 0 0 2px;}
.seg button:last-child{border-radius:0 2px 2px 0;}
.seg button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
header.top{margin-bottom:22px;}
h1{font-family:var(--display); font-size:clamp(28px,4.6vw,42px); font-weight:600; margin:2px 0 6px;
  letter-spacing:-.01em; line-height:1.08; text-wrap:balance;}
.sub{color:var(--ink-2); margin:0; max-width:74ch;}
.meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.chip{display:inline-flex; align-items:center; gap:6px; background:var(--chip-bg);
  border-radius:2px; padding:3px 11px; font-size:12.5px; color:var(--ink-2);}
.chip b{color:var(--ink); font-weight:600;}

section{margin-top:34px;}
h2{font-family:var(--display); font-size:21px; font-weight:600; margin:0;}
.sec-note{color:var(--ink-2); font-size:13.5px; margin:3px 0 12px; max-width:78ch;}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);}

/* ---------- veredicto + barra de evidencia ---------- */
.hero{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:14px;}
.verdict{padding:20px 22px; border-left:3px solid var(--accent);}
.verdict p.big{font-family:var(--display); font-size:clamp(20px,2.4vw,26px); line-height:1.22;
  margin:8px 0 10px; font-weight:500; text-wrap:pretty;}
.verdict p.small{color:var(--ink-2); font-size:13.5px; margin:0;}
.ladder{padding:20px 22px;}
.ladder h3{margin:0 0 14px; font-size:14px; font-weight:600; color:var(--ink-2);}
/* la barra: un solo eje (36 requisitos), segmentos con hueco de 2 px del color
   de la superficie, extremos redondeados a 4 px */
.stack{display:flex; gap:2px; height:24px; background:var(--panel);}
.stack .s{min-width:6px; cursor:pointer; border:0; padding:0;}
.stack .s:first-child{border-radius:4px 0 0 4px;}
.stack .s:last-child{border-radius:0 4px 4px 0;}
.stack .s:hover, .stack .s:focus-visible{filter:brightness(1.12);}
.s.medido,.cell.medido .g,.dot.medido{background:var(--ev-medido);}
.s.simulado,.cell.simulado .g,.dot.simulado{background:var(--ev-simulado);}
.s.declarado,.cell.declarado .g,.dot.declarado{background:var(--ev-declarado);}
.s.falta,.cell.falta .g,.dot.falta{background:var(--ev-falta);}
.legend{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:14px;}
.lv{border:1px solid var(--line-soft); background:var(--panel-2); border-radius:2px; padding:10px 12px;
  text-align:left; cursor:pointer; width:100%; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start;}
.lv[aria-pressed="true"]{border-color:var(--accent);}
.lv .n{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:26px; font-weight:600; line-height:1.1; color:var(--ink); display:block;}
.lv .nm{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--ink); margin-top:4px;}
.lv .df{display:block; font-size:12px; font-weight:400; color:var(--ink-2); margin-top:3px; line-height:1.35;}
.dot{display:inline-grid; place-items:center; width:16px; height:16px; border-radius:2px; color:#0E1826; flex:none;}
.dot svg, .cell .g svg{display:block;}

/* ---------- mapa de evidencia: una casilla por requisito ---------- */
.map{padding:8px 22px 14px;}
.maprow{display:grid; grid-template-columns:minmax(150px,250px) 1fr auto; gap:14px; align-items:center;
  padding:9px 0; border-bottom:1px solid var(--line-soft);}
.maprow:last-child{border-bottom:0;}
.maprow .fam{background:none; border:0; padding:0; text-align:left; font-size:14px; font-weight:500; color:var(--ink); cursor:pointer;}
.maprow .fam:hover{color:var(--accent); background:none;}
.maprow .fam[aria-pressed="true"]{color:var(--accent);}
.cells{display:flex; flex-wrap:wrap; gap:4px;}
.cell{width:30px; height:30px; padding:0; border:0; background:none; cursor:pointer; position:relative;}
.cell .g{display:grid; place-items:center; width:100%; height:100%; border-radius:2px;
  color:#0E1826;}
.cell:hover .g, .cell:focus-visible .g{outline:2px solid var(--ink); outline-offset:1px;}
.maprow .tot{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--ink-2); white-space:nowrap; display:flex; gap:10px;}
.maprow .tot .tn{display:inline-flex; align-items:center; gap:4px;}
.maprow .tot .dot{width:13px; height:13px;}

/* ---------- los tres hallazgos ---------- */
.finds{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;}
.find{padding:16px 18px; border-top:3px solid var(--ev-falta);}
.find .k{font-family:var(--mono); font-size:12px; color:var(--ink-3);}
.find h3{margin:4px 0 8px; font-family:var(--display); font-size:19px; font-weight:600; line-height:1.2;}
.find p{margin:0 0 8px; color:var(--ink-2); font-size:13.5px;}
.find p.c{color:var(--ink); margin:0;}
.find p.c b{color:var(--ink-3); font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; font-weight:600; display:block; margin-bottom:2px;}

/* ---------- filtros ---------- */
.filters{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:12px 14px; margin-bottom:12px;}
.fg{display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
.fg .lab{font-size:11.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin-right:2px;}
.fbtn{padding:4px 10px; font-weight:500; font-size:12.5px; display:inline-flex; align-items:center; gap:6px;}
.fbtn[aria-pressed="true"]{border-color:var(--accent); color:var(--ink); background:var(--panel-hi);}
.filters input{background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:2px;
  padding:5px 10px; font:inherit; font-size:13.5px; width:210px;}
.count{margin-left:auto; font-size:13px; color:var(--ink-2);}
.count b{color:var(--ink);}

/* ---------- la lista ---------- */
.group{margin-top:18px;}
.group h3{font-family:var(--display); font-size:17px; font-weight:600; margin:0 0 6px; display:flex; align-items:baseline; gap:10px;}
.group h3 span{font-family:var(--mono); font-size:12px; font-weight:400; color:var(--ink-3);}
.req{display:grid; grid-template-columns:38px minmax(0,1.55fr) minmax(0,.9fr) 118px minmax(0,1.2fr);
  gap:14px; padding:13px 16px; border-bottom:1px solid var(--line-soft); align-items:start; scroll-margin-top:16px;}
.req:last-child{border-bottom:0;}
.req.flash{background:var(--panel-hi);}
.req .num{font-family:var(--mono); font-size:13px; color:var(--ink-3); padding-top:1px;}
.req .rq{font-weight:500;}
.req .hoy{color:var(--ink-2); font-size:13.5px; margin-top:4px;}
/* lo medido en planta: se distingue por la etiqueta, no por el color */
.req .med{color:var(--ink-2); font-size:13.5px; margin-top:6px; padding-left:9px; border-left:2px solid var(--ink-3);}
.tag-medido{display:inline-block; font:600 10.5px var(--mono); letter-spacing:.03em; text-transform:uppercase; color:var(--ink);
  border:1px solid var(--ink-3); border-radius:5px; padding:0 5px; margin-right:3px; white-space:nowrap;}
@media (max-width:560px){ .tag-medido{white-space:normal;} }
.req .tl{font-size:13px;}
.req .tl a, .req .tl span.t{display:block; margin-bottom:3px;}
.req .tl span.t{color:var(--ink-2);}
.req .tl small{color:var(--ink-3);}
.req .cl{font-size:13.5px;}
.req .cl .who{display:inline-block; margin-top:6px; font-size:11.5px; color:var(--ink-2);
  background:var(--chip-bg); border-radius:2px; padding:2px 8px;}
.hd{display:none;}
.pill{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--ink);
  border-radius:2px; padding:3px 9px 3px 5px; background:var(--panel-2); border:1px solid var(--line-soft);}
.empty{padding:22px; color:var(--ink-2); text-align:center;}

/* ---------- alcance y fuentes ---------- */
.two{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
.box{padding:16px 18px;}
.box h3{margin:0 0 8px; font-size:14px; font-weight:600;}
.box p, .box li{color:var(--ink-2); font-size:13.5px;}
.box ul{margin:0; padding-left:18px;}
.box li{margin-bottom:4px;}
footer{margin-top:36px; border-top:1px solid var(--line); padding-top:14px; color:var(--ink-2); font-size:13px;}
footer code{font-family:var(--mono); font-size:12.5px; background:var(--chip-bg); border-radius:2px; padding:1px 6px; color:var(--ink);}

/* ---------- el rótulo al pasar por una marca ---------- */
#tip{position:fixed; z-index:20; pointer-events:none; max-width:320px; background:#0A1220; color:var(--ink);
  border:1px solid var(--line); border-radius:2px; padding:8px 10px; font-size:12.5px; line-height:1.4;
  box-shadow:0 6px 24px rgba(0,0,0,.45); display:none;}
#tip b{display:block; font-size:12px; color:var(--ink-2); font-weight:600; margin-bottom:2px;}

@media (max-width:980px){
  .hero,.finds,.two{grid-template-columns:1fr;}
  .legend{grid-template-columns:repeat(2,minmax(0,1fr));}
  .req{grid-template-columns:34px minmax(0,1fr); gap:6px 12px;}
  .req .tl,.req .ev,.req .cl{grid-column:2;}
  .hd{display:block; font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin:6px 0 2px;}
  .maprow{grid-template-columns:1fr auto;}
  .maprow .cells{grid-column:1 / -1; order:3;}
  .count{margin-left:0;}
}
@media (prefers-reduced-motion: no-preference){
  .req{transition:background-color .6s ease;}
}

/* ---------- en papel: claro, entero y sin controles ---------- */
@media print{
  @page{margin:13mm;}
  :root{color-scheme:light; --void:#fff; --panel:#fff; --panel-2:#fff; --panel-hi:#fff; --line:#B9C0C8; --line-soft:#D9DEE3;

function counts(list){
  const n={ total:list.length }; EV.forEach(e=>{ n[e.k]=list.filter(r=>r.ev===e.k).length; }); return n;
}
function pasa(r){
  if(F.ev && r.ev!==F.ev) return false;
  if(F.w && r.w!==F.w) return false;
  if(F.f && r.f!==F.f) return false;
  if(F.q){
    const hay=(r.es+' '+r.en+' '+r.hes+' '+r.hen+' '+r.ces+' '+r.cen+' '+r.t.map(x=>TOOLS[x[0]].es+' '+TOOLS[x[0]].en).join(' ')).toLowerCase();
    if(!hay.includes(F.q.toLowerCase())) return false;
  }
  return true;
}
/* Los signos van dibujados, no escritos: como carácter («◐») dependían de la fuente

};
const signo=(k,px)=>`<svg viewBox="0 0 12 12" width="${px}" height="${px}" fill="currentColor" aria-hidden="true">${SIGNO[k]}</svg>`;
const dot=e=>`<span class="dot ${e.k}" aria-hidden="true">${signo(e.k,10)}</span>`;

  $('eyebrow').textContent=t.eyebrow; $('h1').textContent=t.h1; $('sub').textContent=t.sub;
  $('meta').innerHTML=`<span class="chip">${t.rev} <b class="mono">${REVISION}</b></span>`+
    `<span class="chip"><b class="mono">${n.total}</b> ${t.reqs}</span>`+
    `<span class="chip">${t.ver} <b class="mono">${VER}</b></span>`;
  $('vEyebrow').textContent=t.vEyebrow; $('vBig').textContent=t.vBig(n); $('vSmall').textContent=t.vSmall;
  $('ladTitle').textContent=t.ladTitle(n);
  $('mapTitle').textContent=t.mapTitle; $('mapNote').textContent=t.mapNote;
  $('findTitle').textContent=t.findTitle; $('findNote').textContent=t.findNote;
  $('listTitle').textContent=t.listTitle; $('listNote').textContent=t.listNote;
  $('scopeTitle').textContent=t.scopeTitle;
  $('scopeBox').innerHTML=`<h3>${t.scopeH}</h3><ul>${t.scope.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
  $('srcBox').innerHTML=`<h3>${t.srcH}</h3><ul>${SOURCES.map(s=>`<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join('')}</ul>`;

  document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.lang===LANG)));

/* La etiqueta de una campaña de medida: nivel · planta · fuente · periodo. */
function etiquetaMedida(k){ const m=MEDIDAS[k]; if(!m) return '';
  return (LANG==='es'?'Medido':'Measured')+' · '+m.planta+' · '+(LANG==='es'?m.es:m.en)+' · '+m.periodo; }
/* El ÚNICO camino por el que una cifra medida en planta llega a la ficha. */
function medidoHTML(r){ if(!r.med) return '';
  const m=MEDIDAS[r.med];
  return `<div class="med"><span class="tag-medido" title="${esc((LANG==='es'?m.nes:m.nen)+' · '+m.prog)}">${esc(etiquetaMedida(r.med))}</span> ${esc(LANG==='es'?r.mes:r.men)}</div>`; }
function pintaLista(){
  const t=T[LANG], vis=REQS.filter(pasa);
  const c=$('count'); if(c) c.innerHTML=t.shown(vis.length, REQS.length)+
    ((F.ev||F.w||F.f||F.q)?` · <a href="#lista" id="clr">${t.clear}</a>`:'');
  const html=FAM.map(f=>{
    const rs=vis.filter(r=>r.f===f.k); if(!rs.length) return '';
    return `<div class="group" data-group="${f.k}"><h3>${esc(L(f))} <span>${rs.length}</span></h3><div class="panel">`+
      rs.map(r=>{ const e=byK(EV,r.ev), w=byK(WHO,r.w);
        const tools=r.t.length? r.t.map(x=>{ const tl=TOOLS[x[0]], nota=x[1]?` <small>(${esc(x[1])})</small>`:'';
            return tl.url? `<a href="${esc(tl.url)}"${/^https?:/.test(tl.url)?' target="_blank" rel="noopener"':''}>${esc(L(tl))}${nota}</a>`
                         : `<span class="t">${esc(L(tl))}${nota}</span>`; }).join('')
          : `<span class="t">${t.noTool}</span>`;
        return `<div class="req" id="r-${r.n}" data-ev="${r.ev}">`+
          `<div class="num">${String(r.n).padStart(2,'0')}</div>`+
          `<div><div class="rq">${esc(L(r))}</div><div class="hoy">${esc(LANG==='es'?r.hes:r.hen)}</div>${medidoHTML(r)}</div>`+
          `<div class="tl"><div class="hd">${t.hTool}</div>${tools}</div>`+
          `<div class="ev"><div class="hd">${t.hEv}</div><span class="pill">${dot(e)}${esc(L(e))}</span></div>`+

        `</div>`; }).join('')+`</div></div>`;
  }).join('');
  $('groups').innerHTML=html || `<div class="panel empty">${t.none}</div>`;
}

/* ---------- interacción ---------- */
function irA(n){
  const r=REQS.find(x=>x.n===n); if(!r) return;
  if(!pasa(r)){ F.ev=F.w=F.f=null; F.q=''; pintaResumen(); pintaMapa(); pintaFiltros(); pintaLista(); }
  const el=$('r-'+n); if(!el) return;
  el.scrollIntoView({ behavior:'smooth', block:'center' });
  el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 1600);
}
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){ e.preventDefault(); irA(+go.dataset.go); return; }
  const ev=e.target.closest('[data-ev].s, .lv[data-ev]');
  if(ev){ F.ev=(F.ev===ev.dataset.ev)?null:ev.dataset.ev; pintaResumen(); pintaFiltros(); pintaLista(); return; }
  const fam=e.target.closest('[data-fam]');
  if(fam){ F.f=(F.f===fam.dataset.fam)?null:fam.dataset.fam; pintaMapa(); pintaLista(); $('lista').scrollIntoView({behavior:'smooth'}); return; }
  const fb=e.target.closest('.fbtn');
  if(fb){ F[fb.dataset.f]=fb.dataset.v||null; pintaResumen(); pintaFiltros(); pintaLista(); return; }
  if(e.target.id==='clr'){ e.preventDefault(); F.ev=F.w=F.f=null; F.q=''; pintaResumen(); pintaMapa(); pintaFiltros(); pintaLista(); return; }
  const lg=e.target.closest('#langs button');
  if(lg){ LANG=lg.dataset.lang; try{ localStorage.setItem('factiun_homologacion_lang',LANG); }catch(err){} pintaTodo(); return; }
});
$('btnPrint').addEventListener('click',()=>window.print());

/* el rótulo: una sola caja, para ratón y para teclado */
const tip=$('tip');
function muestraTip(el){
  const [a,b]=(el.dataset.tip||'').split('|');
  tip.innerHTML=`<b>${esc(a||'')}</b>${esc(b||'')}`; tip.style.display='block';
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=r.left+r.width/2-w/2, y=r.top-h-8;
  x=Math.max(8, Math.min(x, innerWidth-w-8)); if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
const ocultaTip=()=>{ tip.style.display='none'; };
document.addEventListener('mouseover',e=>{ const el=e.target.closest('[data-tip]'); if(el) muestraTip(el); else ocultaTip(); });
document.addEventListener('focusin',e=>{ const el=e.target.closest('[data-tip]'); if(el) muestraTip(el); else ocultaTip(); });
document.addEventListener('scroll',ocultaTip,{ passive:true });

pintaTodo();
if(/^#r-\d+$/.test(location.hash)) setTimeout(()=>irA(+location.hash.slice(3)), 60);
</script>
